# Releases are automatic: bump "version" in package.json and merge to main.
# When that version isn't on npm yet, this publishes @groundmail/groundhog (npm trusted
# publishing over OIDC, so no npm token is stored anywhere, with provenance), tags vX.Y.Z,
# creates a GitHub release, and pushes the Docker image to ghcr.io/groundmail/groundhog
# (and Docker Hub as groundmail/groundhog when DOCKERHUB_* secrets are set).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "@groundmail/groundhog@${version}" version --prefer-online >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@groundmail/groundhog@${version} is already on npm; nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing @groundmail/groundhog@${version}"
          fi

  npm:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or newer.
          # No registry-url: it writes an .npmrc with a placeholder token, and npm then
          # publishes with that token instead of trusted publishing (OIDC).
          node-version: '24'
          cache: npm
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

  docker:
    needs: [check, npm]
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/groundmail/groundhog
            ${{ env.HAS_DOCKERHUB == 'true' && 'docker.io/groundmail/groundhog' || '' }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
